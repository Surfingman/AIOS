<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI-Native OS — 3D Orb Shell</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="statusbar">
    <span id="status-location">📍 위치 로딩중...</span>
    <span id="status-battery">🔋 --%</span>
    <span id="status-mode">🎙 대기중</span>
    <a href="/" id="switch-link">← 2D 캔버스 보기</a>
  </div>

  <div id="hint">드래그해서 오브 주위를 둘러보세요 (아이콘이 나타납니다) · 아래에 원하는 것을 말해보세요</div>

  <div id="card-panel"></div>

  <form id="intent-form">
    <input id="intent-input" type="text" autocomplete="off"
           placeholder="예) 내일 오후 3시에 팀 회의 잡고, 관련 자료 찾아줘" />
    <button type="submit">보내기</button>
  </form>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
