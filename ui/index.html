<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI-Native OS — Adaptive Canvas</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="statusbar">
    <span id="status-location">📍 위치 로딩중...</span>
    <span id="status-battery">🔋 --%</span>
    <span id="status-form">🖥 --</span>
    <a href="/3d" style="margin-left:auto;color:#6ea8fe;font-size:12px;text-decoration:none;">3D 오브 뷰 →</a>
  </div>

  <main id="canvas">
    <div id="empty-hint">
      아래 입력창에 의도를 말해보세요. 예)
      <code>"내일 오후 3시에 팀 회의 잡고, 관련 자료 찾아줘"</code>
    </div>
  </main>

  <form id="intent-form">
    <input id="intent-input" type="text" autocomplete="off"
           placeholder="여기에 원하는 것을 자연어로 입력하세요..." />
    <button type="submit">보내기</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
